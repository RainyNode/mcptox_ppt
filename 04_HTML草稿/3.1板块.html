<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body {
    margin:0;
    background:#ffffff;
    font-family:
    "Arial",
    "Helvetica Neue",
    sans-serif;
}


/* PPT区域 */
.dataset-box {

    width:1100px;
    height:230px;

    border:1px solid #d8dde6;
    background:#ffffff;

}


/* 深蓝标题栏 */
.title-bar {

    height:38px;
    background:#17365D;

    display:flex;
    align-items:center;

    padding-left:22px;

    color:white;

    font-size:20px;
    font-weight:600;

    letter-spacing:0.3px;
}


/* 内容区域 */

.stats-area {

    height:190px;

    display:flex;

    align-items:center;

    padding:0 20px;

}


/* 单个指标 */

.stat {

    flex:1;

    height:105px;

    text-align:center;

    position:relative;

}


/* 分隔线 */

.stat:not(:last-child)::after {

    content:"";

    position:absolute;

    right:0;

    top:10px;

    height:85px;

    width:1px;

    background:#d9d9d9;

}


/* 数字 */

.value {

    font-size:42px;

    font-weight:700;

    color:#111827;

    line-height:1.1;

}


/* 英文名称 */

.label {

    margin-top:12px;

    font-size:17px;

    font-weight:600;

    color:#1f2937;

}


/* 中文说明 */

.cn {

    margin-top:7px;

    font-size:14px;

    color:#6b7280;

}



</style>

</head>


<body>


<div class="dataset-box">


    <div class="title-bar">

        Dataset Statistics

    </div>



    <div class="stats-area">


        <div class="stat">

            <div class="value">
                45+
            </div>

            <div class="label">
                Real-world MCP Servers
            </div>

            <div class="cn">
                真实MCP服务器
            </div>

        </div>




        <div class="stat">

            <div class="value">
                353
            </div>

            <div class="label">
                Authentic Tools
            </div>

            <div class="cn">
                真实工具
            </div>

        </div>





        <div class="stat">

            <div class="value">
                1348
            </div>

            <div class="label">
                Malicious Test Cases
            </div>

            <div class="cn">
                恶意测试用例
            </div>

        </div>





        <div class="stat">

            <div class="value">
                20
            </div>

            <div class="label">
                LLM Agents
            </div>

            <div class="cn">
                评测模型
            </div>

        </div>



    </div>


</div>


</body>
</html>
