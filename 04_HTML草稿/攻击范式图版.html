<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>MCP 工具投毒</title>

<style>
body {
    margin: 0;
    background: white;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

.figure {
    width: 600px;
    height: 600px;
    margin: auto;
    background: #ffffff;
    position: relative;
}

/* 标题 */
.title {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #222;
}


/* 顶部攻击节点 */
.root {
    position:absolute;
    top:85px;
    left:170px;
    width:260px;
    height:55px;
    border:2px solid #b23b3b;
    border-radius:10px;
    background:#fff5f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    color:#9b2226;
}


/* 连线 */
.line {
    position:absolute;
    background:#555;
}

.vertical {
    width:2px;
}

.horizontal {
    height:2px;
}


/* 三个攻击框 */

.attack {
    position:absolute;
    width:155px;
    height:230px;
    border-radius:12px;
    border:1.5px solid #777;
    background:#fafafa;
    text-align:center;
    padding-top:15px;
    box-sizing:border-box;
}


.attack h3 {
    margin:5px 0 12px;
    font-size:16px;
    color:#333;
}


.tag {
    margin:8px auto;
    width:120px;
    padding:6px;
    border-radius:6px;
    font-size:13px;
    background:#eef3f8;
}


.arrow {
    font-size:22px;
    margin:8px;
    color:#555;
}


.effect {
    margin-top:8px;
    font-size:12px;
    color:#a00000;
}


/* 位置 */

.p1 {
    left:25px;
    top:230px;
}

.p2 {
    left:222px;
    top:230px;
}

.p3 {
    left:419px;
    top:230px;
}


/* 底部说明 */
.note {
    position:absolute;
    bottom:35px;
    left:70px;
    width:460px;
    border-top:1px solid #ccc;
    padding-top:12px;
    text-align:center;
    font-size:13px;
    color:#555;
}

</style>
</head>


<body>
