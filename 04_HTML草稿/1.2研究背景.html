<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Attack Surface Flow</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: "Times New Roman", "Noto Serif SC", serif;
    }

    .wrap {
      width: 1280px;
      margin: 24px auto;
      background: #fff;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .box-blue {
      fill: #fbfbfb;
      stroke: #1f5fa8;
      stroke-width: 2.4;
    }

    .box-red {
      fill: #fffafa;
      stroke: #d84a3f;
      stroke-width: 2.4;
    }

    .text-blue {
      fill: #1f4e86;
      font-size: 22px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-black {
      fill: #222;
      font-size: 22px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-red {
      fill: #d84a3f;
      font-size: 22px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-red-small {
      fill: #d84a3f;
      font-size: 18px;
      text-anchor: middle;
      dominant-baseline: middle;
      font-style: italic;
    }

    .arrow-blue {
      stroke: #1f5fa8;
      stroke-width: 2.6;
      fill: none;
      marker-end: url(#arrowBlue);
    }

    .arrow-red {
      stroke: #d84a3f;
      stroke-width: 2.6;
      fill: none;
      marker-end: url(#arrowRed);
    }

    .arrow-red-dashed {
      stroke: #d84a3f;
      stroke-width: 2.6;
      stroke-dasharray: 10 8;
      fill: none;
      marker-end: url(#arrowRed);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#1f5fa8"></path>
        </marker>
        <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#d84a3f"></path>
        </marker>
      </defs>

      <!-- User -->
      <rect x="90" y="210" rx="14" ry="14" width="170" height="64" class="box-blue"/>
      <text x="175" y="242" class="text-blue">User</text>

      <!-- LLM Agent -->
      <rect x="90" y="330" rx="14" ry="14" width="190" height="70" class="box-blue"/>
      <text x="185" y="365" class="text-blue">LLM Agent</text>

      <!-- Reasoning -->
      <rect x="380" y="315" rx="14" ry="14" width="210" height="70" class="box-blue"/>
      <text x="485" y="350" class="text-black">Reasoning</text>

      <!-- Tool Selection -->
      <rect x="380" y="445" rx="14" ry="14" width="210" height="70" class="box-blue"/>
      <text x="485" y="480" class="text-black">Tool Selection</text>

      <!-- MCP Tool -->
      <rect x="380" y="565" rx="14" ry="14" width="210" height="70" class="box-blue"/>
      <text x="485" y="600" class="text-black">MCP Tool</text>

      <!-- Tool Response -->
      <rect x="380" y="685" rx="14" ry="14" width="210" height="70" class="box-blue"/>
      <text x="485" y="720" class="text-black">Tool Response</text>

      <!-- Agent Action -->
      <rect x="380" y="785" rx="14" ry="14" width="210" height="70" class="box-blue"/>
      <text x="485" y="820" class="text-black">Agent Action</text>

      <!-- Attacker -->
      <text x="930" y="90" class="text-red">Attacker</text>

      <!-- Poisoned Tool Description / Metadata -->
      <rect x="760" y="150" rx="14" ry="14" width="340" height="110" class="box-red"/>
      <text x="930" y="192" class="text-red">Poisoned Tool Description</text>
      <text x="930" y="228" class="text-red">/ Metadata</text>

      <!-- Attack Surface label -->
      <text x="930" y="288" class="text-red-small">Tool Description = Attack Surface</text>

      <!-- Normal flow -->
      <line x1="175" y1="274" x2="185" y2="330" class="arrow-blue"/>

      <!-- LLM Agent branching -->
      <line x1="280" y1="365" x2="380" y2="350" class="arrow-blue"/>
      <line x1="280" y1="365" x2="380" y2="480" class="arrow-blue"/>

      <!-- Tool pipeline -->
      <line x1="485" y1="515" x2="485" y2="565" class="arrow-blue"/>
      <line x1="485" y1="635" x2="485" y2="685" class="arrow-blue"/>
      <line x1="485" y1="755" x2="485" y2="785" class="arrow-blue"/>

      <!-- Attack flow -->
      <line x1="930" y1="105" x2="930" y2="150" class="arrow-red"/>
      <path d="M760 205 L680 205 L680 480 L590 480" class="arrow-red-dashed"/>
    </svg>
  </div>
</body>
</html>
